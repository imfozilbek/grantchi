name: Collect opportunities

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Check every source regardless of its schedule"
        type: boolean
        default: false
      max_items:
        description: "Max items sent to the AI pool"
        default: "25"

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: collector/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Seen items and per-source check times, carried between runs.
      - uses: actions/cache/restore@v4
        with:
          path: collector/state
          key: collector-state-${{ github.run_id }}
          restore-keys: collector-state-

      - name: Collect
        run: npm run collect
        env:
          FORCE: ${{ inputs.force && '1' || '' }}
          MAX_ITEMS: ${{ inputs.max_items || '25' }}
          GRANTCHI_API_URL: ${{ vars.GRANTCHI_API_URL }}
          GRANTCHI_INGEST_SECRET: ${{ secrets.GRANTCHI_INGEST_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: collector/state
          key: collector-state-${{ github.run_id }}

      # Until the Worker API exists, drafts are kept as a run artifact for review.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collect-${{ github.run_id }}
          path: collector/out/
          retention-days: 14
          if-no-files-found: ignore
